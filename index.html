<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>USSO Tractopartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #0a0a0b; color: #f3f1ec; padding: 24px;
    font-family: 'Inter', system-ui, sans-serif;
    background-image: radial-gradient(circle at 50% 20%, rgba(246,192,42,0.07), transparent 60%);
  }
  .gate { width: 100%; max-width: 360px; text-align: center; }
  .logo {
    width: 100%; max-width: 260px; height: auto; display: block;
    margin: 0 auto 22px; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.55));
  }
  .badge {
    display: inline-block; padding: 6px 12px; border-radius: 999px;
    background: rgba(246,192,42,0.12); border: 1px solid rgba(246,192,42,0.3);
    color: #f6c02a; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; font-weight: 600; margin-bottom: 26px;
  }
  p.sub { font-size: 14px; line-height: 1.5; color: rgba(243,241,236,0.55); margin-bottom: 28px; }
  .gate form { display: flex; flex-direction: column; gap: 10px; }
  form[hidden] { display: none !important; }
  input {
    width: 100%; padding: 14px 16px; border-radius: 10px;
    background: rgba(243,241,236,0.05); border: 1px solid rgba(243,241,236,0.14);
    color: #f3f1ec; font-size: 15px; font-family: inherit; text-align: center;
    letter-spacing: 0.04em; outline: none; transition: border-color 0.18s, background 0.18s;
  }
  input:focus { border-color: rgba(246,192,42,0.6); background: rgba(243,241,236,0.08); }
  input::placeholder { color: rgba(243,241,236,0.3); letter-spacing: 0; }
  button {
    width: 100%; padding: 14px 16px; border: none; border-radius: 10px;
    background: #f6c02a; color: #0a0a0b; font-size: 14px; font-weight: 600;
    font-family: inherit; letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer; transition: filter 0.18s;
  }
  button:hover { filter: brightness(1.08); }
  .err { font-size: 13px; color: #ff6b5e; min-height: 18px; margin-top: 4px; }
  .foot { margin-top: 32px; font-size: 11px; color: rgba(243,241,236,0.3); letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="gate">
  <div class="badge">Acceso privado</div>
  <img class="logo" src="assets/logo-usso-v2-transparent.png" alt="USSO Tractopartes">
  <p class="sub">Sitio en construcción. Ingresa la clave de acceso para continuar.</p>
  <form id="f">
    <input id="k" type="password" placeholder="Clave de acceso" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
    <div class="err" id="e"></div>
  </form>
  <div class="foot">Vista previa &middot; No público</div>
</div>

<form name="usso-registro" data-netlify="true" hidden>
  <input type="text" name="nombre">
  <input type="tel" name="whatsapp">
  <input type="email" name="correo">
  <input type="text" name="ciudad">
</form>
<form name="usso-autorizacion" data-netlify="true" hidden>
  <input type="text" name="nombre">
  <input type="tel" name="whatsapp">
  <input type="email" name="correo">
  <input type="text" name="ciudad">
  <textarea name="mensaje"></textarea>
</form>
<form name="usso-puja" data-netlify="true" hidden>
  <input type="text" name="nombre">
  <input type="tel" name="whatsapp">
  <input type="email" name="correo">
  <input type="text" name="lote">
  <input type="text" name="pieza">
  <input type="text" name="monto">
</form>
<script>
(function () {
  var CLAVE = 'usso2026';
  var DEST = 'usso-tractopartes.dc.html';
  var LLAVE = 'usso_acceso_ok';

  function abrir() { location.replace(DEST); }

  // link directo con clave: ussotractopartes.com/?acceso=usso2026
  var q = new URLSearchParams(location.search).get('acceso');
  if (q === CLAVE) { try { localStorage.setItem(LLAVE, '1'); } catch (e) {} abrir(); return; }
  try { if (localStorage.getItem(LLAVE) === '1') { abrir(); return; } } catch (e) {}

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = document.getElementById('k').value.trim().toLowerCase();
    if (v === CLAVE) { try { localStorage.setItem(LLAVE, '1'); } catch (e) {} abrir(); }
    else {
      document.getElementById('e').textContent = 'Clave incorrecta.';
      document.getElementById('k').value = '';
      document.getElementById('k').focus();
    }
  });
})();
</script>
</body>
</html>
