<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detalle de subasta · USSO Tractopartes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box} :root{--yellow:#f6c02a;--bg:#0a0a0b;--card:#141416;--text:#f3f1ec}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
    a{color:inherit;text-decoration:none}.nav{height:82px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #242428;position:sticky;top:0;background:rgba(10,10,11,.94);backdrop-filter:blur(12px);z-index:5}
    .logo{width:165px;max-height:58px;object-fit:contain}.back{font-weight:800;border-bottom:2px solid var(--yellow);padding-bottom:5px}
    main{width:min(1180px,92vw);margin:0 auto;padding:64px 0 90px}.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:54px;align-items:start}
    .photo{background:var(--card);border:1px solid #28282d;border-radius:22px;overflow:hidden;aspect-ratio:1/1;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover}.photo .empty{color:#777;font-weight:700}
    .badge{display:inline-flex;padding:7px 13px;border-radius:99px;background:rgba(246,192,42,.12);border:1px solid rgba(246,192,42,.4);color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{font:42px/1.08 'Archivo Black',sans-serif;margin:18px 0}.desc{color:#aaa;font-size:16px;line-height:1.7}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0}.metric{background:var(--card);border:1px solid #29292e;border-radius:15px;padding:18px}.label{color:#85858d;font-size:12px;font-weight:700}.value{font:25px 'Archivo Black',sans-serif;margin-top:6px}.price{color:var(--yellow)}
    .end-exact{display:block;color:#85858d;font-size:11px;font-weight:700;margin-top:8px}.value.ended{color:#ff5c52}.badge.closed{color:#ff8a80;border-color:rgba(255,92,82,.45);background:rgba(255,92,82,.1)}
    .notice{padding:17px 18px;border:1px solid rgba(246,192,42,.35);background:rgba(246,192,42,.08);border-radius:14px;color:#d8d2c4;line-height:1.5;margin:0 0 16px}.actions{display:grid;gap:12px}.bid-form{display:flex;gap:10px}.bid-form input{min-width:0;flex:1;background:#19191c;border:1px solid #39393f;color:#fff;border-radius:12px;padding:15px;font:700 16px Manrope;outline:none}.bid-form input.invalid{border-color:#ff5c52;box-shadow:0 0 0 3px rgba(255,92,82,.12)}.btn{border:0;border-radius:99px;padding:15px 24px;background:var(--yellow);color:#090909;font:800 15px Manrope;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.45}.btn.secondary{display:block;text-align:center;background:transparent;border:1px solid #444;color:#fff}.msg{min-height:22px;color:#ffb5b5;font-weight:700}.hidden{display:none!important}.loading,.not-found{text-align:center;padding:120px 20px}.not-found h1{font-size:36px}
    @media(max-width:800px){.nav{padding:0 20px}.logo{width:125px}.grid{grid-template-columns:1fr;gap:28px}main{padding-top:30px}h1{font-size:31px}.bid-form{flex-direction:column}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="usso-tractopartes.dc.html#subastas"><img class="logo" src="assets/logo-usso-v2-transparent.png" alt="USSO Tractopartes"></a>
    <a class="back" href="usso-tractopartes.dc.html#subastas">← Volver a subastas</a>
  </nav>

  <main>
    <div id="loading" class="loading">Cargando lote...</div>
    <div id="notFound" class="not-found hidden"><h1>Lote no encontrado</h1><a class="back" href="usso-tractopartes.dc.html#subastas">← Volver a subastas</a></div>
    <section id="detail" class="grid hidden">
      <div class="photo"><img id="image" alt=""><div id="noImage" class="empty hidden">Foto próximamente</div></div>
      <div>
        <span id="status" class="badge"></span>
        <h1 id="title"></h1>
        <p id="description" class="desc"></p>
        <div class="meta">
          <div class="metric"><div id="priceLabel" class="label">Precio actual</div><div id="price" class="value price"></div></div>
          <div class="metric"><div class="label">Cierre</div><div id="ends" class="value"></div><span id="endExact" class="end-exact"></span></div>
        </div>
        <div id="guest" class="actions hidden"><div class="notice">Inicia sesión para participar en esta subasta.</div><a class="btn secondary" href="login.html">Iniciar sesión</a></div>
        <div id="pending" class="actions hidden"><div class="notice">Tu cuenta todavía necesita autorización de USSO antes de poder pujar.</div><button id="requestAuth" class="btn">Solicitar autorización</button></div>
        <form id="bidForm" class="actions hidden"><div id="minimum" class="notice"></div><div class="bid-form"><input id="amount" type="number" min="1" step="1" required placeholder="Cantidad de tu puja"><button id="bidButton" class="btn" type="submit" disabled>Pujar ahora</button></div></form>
        <p id="msg" class="msg"></p>
      </div>
    </section>
  </main>

  <script>
    const client = window.supabase.createClient(
      "https://ahhlfvjicxylidpmeciw.supabase.co",
      "sb_publishable_9Rr6Nv0ByITBW4TLhdC_HQ_WWpv4q5e"
    );
    const STORE_PHONE = "524522822400";
    const lotId = window.location.hash.slice(1);
    let listing = null;
    let currentUser = null;
    let minimumBid = 0;
    let userIsLeading = false;

    const money = (value) => Number(value || 0).toLocaleString("es-MX", {style:"currency",currency:"MXN",maximumFractionDigits:0});
    const show = (id) => document.getElementById(id).classList.remove("hidden");
    const hide = (id) => document.getElementById(id).classList.add("hidden");
    const calculateMinimum = (value) => {
      const current = Number(value || 0);
      return current + 1000;
    };
    const isActive = (data) => data?.status === "active" && !!data.ends_at && new Date(data.ends_at).getTime() > Date.now();
    const countdown = (milliseconds) => {
      const total = Math.max(0, Math.floor(milliseconds / 1000));
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const clock = [hours, minutes, seconds].map((value) => String(value).padStart(2,"0")).join(":");
      return days ? `${days}d ${clock}` : clock;
    };
    function renderAuctionTime(data) {
      const active = isActive(data);
      const ends = document.getElementById("ends");
      const badge = document.getElementById("status");
      badge.textContent = active ? "Subasta activa" : "Subasta finalizada";
      badge.classList.toggle("closed", !active);
      document.getElementById("priceLabel").textContent = active ? "Precio actual" : "Precio final";
      ends.textContent = data?.ends_at ? countdown(new Date(data.ends_at).getTime() - Date.now()) : "Fecha pendiente";
      ends.classList.toggle("ended", !active);
      document.getElementById("endExact").textContent = data?.ends_at ? new Date(data.ends_at).toLocaleString("es-MX", {dateStyle:"medium",timeStyle:"short"}) : "La administración debe asignar el cierre";
      if (!active) hide("bidForm");
    }

    function updateMinimum(value) {
      minimumBid = calculateMinimum(value);
      const amount = document.getElementById("amount");
      amount.min = String(minimumBid);
      document.getElementById("minimum").textContent = `Puja mínima: ${money(minimumBid)}`;
      validateAmount();
    }

    function validateAmount() {
      const input = document.getElementById("amount");
      const button = document.getElementById("bidButton");
      const value = Number(input.value);
      const tooLow = input.value !== "" && value < minimumBid;
      input.classList.toggle("invalid", tooLow);
      input.setAttribute("aria-invalid", String(tooLow));
      button.disabled = !value || value < minimumBid;
      const msg = document.getElementById("msg");
      if (tooLow) msg.textContent = `La puja mínima es ${money(minimumBid)}.`;
      else if (msg.textContent.startsWith("La puja mínima")) msg.textContent = "";
      return !button.disabled;
    }

    async function load() {
      if (!lotId) return renderNotFound();
      const {data, error} = await client.from("listings")
        .select("id,title,description,image_url,start_price,current_price,status,ends_at,category,auction_round")
        .eq("id", lotId).single();
      if (error || !data) return renderNotFound();
      listing = data;
      hide("loading"); show("detail");
      document.getElementById("title").textContent = data.title || "Pieza USSO";
      document.getElementById("description").textContent = data.description || "Consulta con USSO para conocer todos los detalles y evidencia de esta pieza.";
      document.getElementById("price").textContent = money(data.current_price || data.start_price);
      updateMinimum(data.current_price || data.start_price);
      renderAuctionTime(data);
      const img = document.getElementById("image");
      if (data.image_url) img.src = data.image_url; else { img.classList.add("hidden"); show("noImage"); }
      if (!isActive(data)) {
        document.getElementById("msg").textContent = "Esta subasta finalizó. Puedes consultar sus detalles y precio final.";
        return;
      }
      const {data:{user}} = await client.auth.getUser();
      currentUser = user;
      if (!user) return show("guest");
      const {data:profile} = await client.from("profiles").select("full_name,phone,city,authorized").eq("id",user.id).single();
      if (!profile?.authorized) return show("pending");
      const {data:ownBid} = await client.from("bids").select("amount").eq("listing_id", data.id).eq("auction_round", data.auction_round || 1).eq("user_id", user.id).order("amount", {ascending:false}).limit(1).maybeSingle();
      userIsLeading = Number(ownBid?.amount || 0) >= Number(data.current_price || data.start_price || 0) && Number(ownBid?.amount || 0) > 0;
      if (userIsLeading) document.getElementById("msg").textContent = "Tu puja es la más alta. Podrás volver a pujar cuando alguien la supere.";
      else if (isActive(data)) show("bidForm");
      else document.getElementById("msg").textContent = "Esta subasta ya no acepta pujas.";
    }

    function renderNotFound(){ hide("loading"); show("notFound"); }

    document.getElementById("bidForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validateAmount()) return;
      const amount = Number(document.getElementById("amount").value);
      const msg = document.getElementById("msg");
      msg.textContent = "Registrando puja...";
      const {error} = await client.rpc("place_bid", {p_listing_id:listing.id,p_amount:amount});
      if (error) { msg.textContent = error.message; return; }
      msg.style.color = "#8ee7aa"; msg.textContent = "Puja registrada correctamente.";
      document.getElementById("price").textContent = money(amount);
      document.getElementById("amount").value = "";
      hide("bidForm");
      userIsLeading = true;
      msg.textContent = "Puja registrada correctamente. Ahora vas ganando esta subasta.";
    });

    document.getElementById("amount").addEventListener("input", validateAmount);

    document.getElementById("requestAuth").addEventListener("click", async () => {
      const msg = document.getElementById("msg");
      msg.textContent = "Enviando solicitud...";
      const text = `Hola, quiero solicitar autorización para pujar en USSO. Mi cuenta es ${currentUser?.email || ""}.`;
      const whatsappUrl = `https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(text)}`;
      const request = client.rpc("request_bid_authorization");
      const whatsappWindow = window.open(whatsappUrl, "_blank");
      const {error} = await request;
      if (error) {
        msg.textContent = error.message;
        return;
      }
      msg.style.color = "#8ee7aa";
      msg.textContent = "Solicitud guardada. Completa el mensaje de WhatsApp para avisarnos también por ese medio.";
      if (!whatsappWindow) window.location.href = whatsappUrl;
    });

    load();
    window.setInterval(async () => {
      if (!listing) return;
      const { data } = await client.from("listings")
        .select("current_price,start_price,status,ends_at,auction_round")
        .eq("id", listing.id)
        .single();
      if (!data) return;
      listing = { ...listing, ...data };
      document.getElementById("price").textContent = money(data.current_price || data.start_price);
      renderAuctionTime(data);
      updateMinimum(data.current_price || data.start_price);
      if (currentUser) {
        const { data: ownBid } = await client.from("bids").select("amount")
          .eq("listing_id", listing.id).eq("auction_round", data.auction_round || 1)
          .eq("user_id", currentUser.id).order("amount", {ascending:false}).limit(1).maybeSingle();
        userIsLeading = Number(ownBid?.amount || 0) >= Number(data.current_price || data.start_price || 0) && Number(ownBid?.amount || 0) > 0;
        const active = isActive(data);
        if (userIsLeading || !active) hide("bidForm"); else show("bidForm");
        if (userIsLeading) document.getElementById("msg").textContent = "Tu puja es la más alta. Podrás volver a pujar cuando alguien la supere.";
        else if (active && document.getElementById("msg").textContent.includes("más alta")) document.getElementById("msg").textContent = "Tu puja fue superada. Ya puedes volver a participar.";
      }
    }, 3000);
    window.setInterval(() => { if (listing) renderAuctionTime(listing); }, 1000);
  </script>
</body>
</html>
