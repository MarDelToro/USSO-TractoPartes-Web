<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="/access-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · USSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
 <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="usso-app.css?v=20261009-2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body.auth-page{background:radial-gradient(ellipse at 100% 0%,#61411540,transparent 40%),#0c0e10}.auth-card{border-radius:24px!important;box-shadow:0 10px 55px #0006!important}.auth-submit{box-shadow:0 3px 20px #e7b63733}.local-connection-note{font:500 11px/1.5 Manrope,sans-serif;color:#aab3bf;text-align:center;margin:15px 0 0}</style></head>
<body class="auth-page">
  <form id="login" class="auth-card">
    <img src="logo-usso-icon.png" alt="USSO">
    <h1>Bienvenido de nuevo</h1>
    <p class="auth-intro" id="authIntro">Ingresa a tu cuenta para consultar tus subastas y administrar tus pujas.</p>
    <div class="auth-field"><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
    <div class="auth-field"><label for="password">Contraseña</label><input id="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required></div>
    <button class="auth-submit" type="submit">Iniciar sesión</button>
    <a href="recuperar.html" style="text-align:center;color:#f6c02a;font-size:13px">Olvidé mi contraseña</a>
    <p class="msg" id="msg" role="status"></p>
    <div class="auth-links"><a class="primary-link" id="registerLink" href="registro.html">Crear una cuenta</a><a href="/usso-tractopartes.dc.html#subastas">Ver subastas</a></div>
  </form>

  <script>
    const client = window.supabase.createClient(
      "https://ahhlfvjicxylidpmeciw.supabase.co",
      "sb_publishable_9Rr6Nv0ByITBW4TLhdC_HQ_WWpv4q5e"
    );
    const params = new URLSearchParams(window.location.search);
    const requestedNext = params.get("next") || "";
    const safeNext = requestedNext && /^(\/(?!\/)|[a-zA-Z0-9_-]+\.html(?:[?#]|$))/.test(requestedNext) && !requestedNext.includes("\\") ? requestedNext : "";
    if (params.get("motivo") === "detalles") {
      document.getElementById("authIntro").textContent = "Inicia sesión para ver todas las fotografías, evidencia y detalles de esta subasta.";
    }
    const registerParams = new URLSearchParams();
    if (safeNext) registerParams.set("next", safeNext);
    if (params.get("motivo")) registerParams.set("motivo", params.get("motivo"));
    if ([...registerParams].length) document.getElementById("registerLink").href = `registro.html?${registerParams.toString()}`;

    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "Entrando...";

      const { data: { user }, error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      });

      if (error) {
        msg.textContent = error.message;
        return;
      }

      const { data: profile } = await client
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      window.location.href = safeNext || "/miembros/";
    });
  </script>
</body>
</html>
