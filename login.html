<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · USSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
 <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="usso-app.css?v=20261009-2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <form id="login" class="auth-card">
    <img src="logo-usso-icon.png" alt="USSO">
    <h1>Bienvenido de nuevo</h1>
    <p class="auth-intro">Ingresa a tu cuenta para consultar tus subastas y administrar tus pujas.</p>
    <div class="auth-field"><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
    <div class="auth-field"><label for="password">Contraseña</label><input id="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required></div>
    <button class="auth-submit" type="submit">Iniciar sesión</button>
    <p class="msg" id="msg"></p>
    <div class="auth-links"><a class="primary-link" href="registro.html">Crear una cuenta</a><a href="/#subastas">Ver subastas</a></div>
  </form>

  <script>
    const client = window.supabase.createClient(
      "https://ahhlfvjicxylidpmeciw.supabase.co",
      "sb_publishable_9Rr6Nv0ByITBW4TLhdC_HQ_WWpv4q5e"
    );

    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "Entrando...";

      const { data: { user }, error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      });

      if (error) {
        msg.textContent = error.message;
        return;
      }

      const { data: profile } = await client
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      window.location.href = profile?.role === "admin" ? "admin.html" : "usso-tractopartes.dc.html";
    });
  </script>
</body>
</html>
