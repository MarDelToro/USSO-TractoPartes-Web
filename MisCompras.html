<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis compras · USSO Tractopartes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}:root{--yellow:#f6c02a;--green:#7ee2a8;--bg:#09090a;--card:#151517;--text:#f3f1ec;--muted:#92929a}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:82px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252528;background:rgba(9,9,10,.95);position:sticky;top:0;z-index:5}.logo{width:160px;max-height:58px;object-fit:contain}.back{font-weight:800;border-bottom:2px solid var(--yellow);padding-bottom:5px}main{width:min(1180px,92vw);margin:auto;padding:58px 0 90px}.eyebrow{color:var(--yellow);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:12px}h1{font:clamp(38px,6vw,68px)/1 'Archivo Black',sans-serif;margin:13px 0 12px}.intro{color:var(--muted);margin:0 0 32px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:34px}.stat{background:var(--card);border:1px solid #2b2b30;border-radius:18px;padding:22px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;margin-top:7px;font:clamp(24px,4vw,38px) 'Archivo Black',sans-serif;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:grid;grid-template-columns:190px minmax(0,1fr);background:var(--card);border:1px solid #2b2b30;border-radius:20px;overflow:hidden;transition:.2s}.card:hover{border-color:rgba(246,192,42,.5);transform:translateY(-2px)}.photo{min-height:180px;background:#101012;display:grid;place-items:center;color:#666;font-weight:700}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:23px}.sold{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.info h2{font:24px/1.15 'Archivo Black',sans-serif;margin:10px 0 20px}.price{color:var(--yellow);font:25px 'Archivo Black',sans-serif}.meta{color:var(--muted);font-size:12px;margin-top:7px}.detail{display:inline-block;margin-top:20px;color:var(--yellow);font-weight:800}.state{text-align:center;padding:100px 20px;color:var(--muted)}.hidden{display:none!important}
    @media(max-width:850px){.nav{height:74px;padding:0 18px}.logo{width:118px}.back{font-size:13px}main{padding-top:34px}.stats{gap:10px}.stat{padding:17px}.grid{grid-template-columns:1fr}.card{grid-template-columns:120px minmax(0,1fr)}.photo{min-height:155px}.info{padding:18px}.info h2{font-size:20px;margin-bottom:15px}}
  </style>
</head>
<body>
  <nav class="nav"><a href="usso-tractopartes.dc.html"><img class="logo" src="assets/logo-usso-v2-transparent.png" alt="USSO Tractopartes"></a><a class="back" href="usso-tractopartes.dc.html?cuenta=1">← Mi cuenta</a></nav>
  <main><span class="eyebrow">Tu historial USSO</span><h1>Mis compras</h1><p class="intro">Todos los lotes que has ganado, reunidos en un solo lugar.</p>
    <div class="stats"><div class="stat"><span>Compras ganadas</span><strong id="count">0</strong></div><div class="stat"><span>Total gastado</span><strong id="total">$0</strong></div></div>
    <div id="loading" class="state">Cargando tus compras...</div><div id="empty" class="state hidden">Todavía no tienes compras ganadas.</div><div id="purchases" class="grid"></div>
  </main>
  <script>
    const client=window.supabase.createClient('https://ahhlfvjicxylidpmeciw.supabase.co','sb_publishable_9Rr6Nv0ByITBW4TLhdC_HQ_WWpv4q5e');const money=v=>Number(v||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
    const escapeHtml=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function load(){const {data:{user}}=await client.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await client.from('listings').select('id,title,description,image_url,current_price,start_price,ends_at,auction_round,winner_id,status').eq('winner_id',user.id).eq('status','closed').order('ends_at',{ascending:false});document.getElementById('loading').classList.add('hidden');if(error||!data?.length){document.getElementById('empty').classList.remove('hidden');return}document.getElementById('count').textContent=data.length;document.getElementById('total').textContent=money(data.reduce((sum,item)=>sum+Number(item.current_price||item.start_price||0),0));document.getElementById('purchases').innerHTML=data.map(item=>`<a class="card" href="Compra.dc.html#${encodeURIComponent(item.id)}"><div class="photo">${item.image_url?`<img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.title)}">`:'Foto próximamente'}</div><div class="info"><span class="sold">✓ Ganada · Compra</span><h2>${escapeHtml(item.title||'Pieza USSO')}</h2><div class="price">${money(item.current_price||item.start_price)}</div><div class="meta">Ronda ${Number(item.auction_round||1)} · ${item.ends_at?new Date(item.ends_at).toLocaleDateString('es-MX',{dateStyle:'medium'}):'Cierre registrado'}</div><span class="detail">Ver todos los detalles →</span></div></a>`).join('')}
    load();
  </script>
</body>
</html>
