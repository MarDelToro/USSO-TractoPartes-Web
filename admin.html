<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · USSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="usso-app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .ghost { background:#2a323e; }
    .warn { background:#b45309; }
  </style>
</head>
<body>
  <main>
    <h1>Panel admin</h1>
    <p id="who"></p>
    <p>
      <a href="perfil.html">Ir a perfil</a> ·
      <a href="subastas.html">Ver subastas</a>
    </p>
    <p class="msg" id="msg">Cargando...</p>

    <h2>Subir pieza</h2>
    <form id="pieza">
      <input id="title" placeholder="Título" required>
      <textarea id="description" placeholder="Descripción" rows="3"></textarea>
      <input id="photo" type="file" accept="image/*">
      <input id="image_url" placeholder="O pega una URL de foto">
      <input id="start_price" type="number" min="0" step="1" placeholder="Precio inicial" required>
      <input id="ends_at" type="datetime-local">
      <button type="submit">Publicar subasta</button>
    </form>

    <h2>Subastas</h2>
    <table>
      <thead>
        <tr>
          <th>Pieza</th>
          <th>Precio</th>
          <th>Estado</th>
          <th>Ganador</th>
          <th>WhatsApp</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="listings"></tbody>
    </table>

    <h2>Usuarios</h2>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>WhatsApp</th>
          <th>Ciudad</th>
          <th>Rol</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <h2>Avisos pendientes</h2>
    <table>
      <thead>
        <tr>
          <th>Pieza</th>
          <th>WhatsApp</th>
          <th>Mensaje</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="avisos"></tbody>
    </table>
  </main>

  <script>
    const client = window.supabase.createClient(
      "https://ahhlfvjicxylidpmeciw.supabase.co",
      "sb_publishable_9Rr6Nv0ByITBW4TLhdC_HQ_WWpv4q5e"
    );
    const msg = document.getElementById("msg");

    async function requireAdmin() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return null;
      }
      const { data: me } = await client.from("profiles").select("full_name, role").eq("id", user.id).single();
      if (!me || me.role !== "admin") {
        msg.textContent = "No tienes permiso de admin.";
        return null;
      }
      document.getElementById("who").textContent = me.full_name + " · " + user.email;
      return user;
    }

    async function loadUsers() {
      const { data, error } = await client
        .from("profiles")
        .select("id, full_name, phone, city, role, authorized")
        .order("created_at", { ascending: false });
      if (error) return msg.textContent = error.message;

      document.getElementById("rows").innerHTML = (data || []).map((p) => {
        const authBtn = p.role === "admin"
          ? ""
          : p.authorized
            ? `<button class="warn" data-unauth="${p.id}">Quitar</button>`
: `<button data-auth="${p.id}" data-phone="${p.phone || ""}">Autorizar</button>`;
        const delBtn = p.role === "admin"
          ? ""
          : `<button class="ghost" data-deluser="${p.id}">Eliminar</button>`;
        return `
          <tr>
            <td>${p.full_name || ""}</td>
            <td>${p.phone || ""}</td>
            <td>${p.city || ""}</td>
            <td>${p.role || ""}</td>
            <td>${p.authorized ? "Autorizada" : "Pendiente"}</td>
            <td>${authBtn} ${delBtn}</td>
          </tr>
        `;
      }).join("");

     document.querySelectorAll("[data-auth]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const { error } = await client.from("profiles").update({ authorized: true }).eq("id", btn.dataset.auth);
    if (error) {
      msg.textContent = error.message;
      return;
    }
    msg.textContent = "Cuenta autorizada";
    const tel = (btn.dataset.phone || "").replace(/\D/g, "").slice(-10);
    if (tel) {
      const texto = "Has sido autorizado para pujar en USSO Tractopartes. Entra a ussotractopartes.com/subastas.html";
      window.open("https://wa.me/52" + tel + "?text=" + encodeURIComponent(texto), "_blank");
    }
    loadUsers();
  });
});

      document.querySelectorAll("[data-unauth]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const { error } = await client.from("profiles").update({ authorized: false }).eq("id", btn.dataset.unauth);
          msg.textContent = error ? error.message : "Autorización quitada";
          if (!error) loadUsers();
        });
      });

      document.querySelectorAll("[data-deluser]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("¿Eliminar este usuario?")) return;
          const { error } = await client.rpc("admin_delete_user", { p_user_id: btn.dataset.deluser });
          msg.textContent = error ? error.message : "Usuario eliminado";
          if (!error) loadUsers();
        });
      });
    }

    async function loadListings() {
      await client.rpc("expire_listings");

      const { data, error } = await client
        .from("listings")
        .select("id, title, current_price, start_price, status, winner_id, ends_at")
        .order("created_at", { ascending: false });
      if (error) return msg.textContent = error.message;

      const { data: people } = await client.from("profiles").select("id, full_name, phone");
      const byId = Object.fromEntries((people || []).map((p) => [p.id, p]));

      document.getElementById("listings").innerHTML = (data || []).map((p) => {
        const w = p.winner_id ? byId[p.winner_id] : null;
        const vencida = p.ends_at && new Date(p.ends_at) < new Date();
        const cerrada = p.status !== "active" || vencida;
        const estado = p.status === "closed" ? "closed" : (vencida ? "closed" : "active");
        const acciones = cerrada
          ? `<button class="ghost" data-reopen="${p.id}">Reabrir</button>
             <button class="warn" data-dellist="${p.id}">Eliminar</button>`
          : `<button data-close="${p.id}">Cerrar</button>`;
        return `
          <tr>
            <td>${p.title}</td>
            <td>${p.current_price || p.start_price}</td>
            <td>${estado}</td>
            <td>${w ? w.full_name : "-"}</td>
            <td>${w ? w.phone : "-"}</td>
            <td>${acciones}</td>
          </tr>
        `;
      }).join("");

      document.querySelectorAll("[data-close]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const { error } = await client.rpc("close_listing", { p_listing_id: btn.dataset.close });
          msg.textContent = error ? error.message : "Subasta cerrada";
          if (!error) loadListings();
        });
      });

      document.querySelectorAll("[data-reopen]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const { error } = await client.from("listings").update({
            status: "active",
            winner_id: null,
            ends_at: null
          }).eq("id", btn.dataset.reopen);
          msg.textContent = error ? error.message : "Subasta reabierta. Ponle fecha otra vez si quieres límite.";
          if (!error) loadListings();
        });
      });

      document.querySelectorAll("[data-dellist]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("¿Eliminar esta pieza? Solo si ya se vendió.")) return;
          const { error } = await client.from("listings").delete().eq("id", btn.dataset.dellist);
          msg.textContent = error ? error.message : "Pieza eliminada";
          if (!error) loadListings();
        });
      });
    }

    async function loadAvisos() {
      const { data, error } = await client
        .from("notifications")
        .select("id, title, phone, message, status")
        .order("created_at", { ascending: false });
      if (error) return msg.textContent = error.message;

      document.getElementById("avisos").innerHTML = (data || []).map((n) => {
        const tel = (n.phone || "").replace(/\D/g, "");
        const wa = tel
          ? `https://wa.me/52${tel.slice(-10)}?text=${encodeURIComponent(n.message)}`
          : "";
        return `
          <tr>
            <td>${n.title || ""}</td>
            <td>${n.phone || "-"}</td>
            <td>${n.message || ""}</td>
            <td>${n.status}</td>
            <td>${wa ? `<a href="${wa}" target="_blank" data-sent="${n.id}">Avisar</a>` : "-"}</td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="5">Sin avisos</td></tr>`;

      document.querySelectorAll("[data-sent]").forEach((a) => {
        a.addEventListener("click", async () => {
          await client.from("notifications").update({ status: "sent" }).eq("id", a.dataset.sent);
        });
      });
    }

    document.getElementById("pieza").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { data: { user } } = await client.auth.getUser();
      const file = document.getElementById("photo").files[0];
      let imageUrl = document.getElementById("image_url").value.trim();

      if (file) {
        const path = Date.now() + "-" + file.name.replace(/\s+/g, "-");
        const { error: upErr } = await client.storage.from("listings").upload(path, file);
        if (upErr) {
          msg.textContent = upErr.message;
          return;
        }
        imageUrl = client.storage.from("listings").getPublicUrl(path).data.publicUrl;
      }

      const start = Number(document.getElementById("start_price").value || 0);
      const ends = document.getElementById("ends_at").value;
      const { error } = await client.from("listings").insert({
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        image_url: imageUrl,
        start_price: start,
        current_price: start,
        status: "active",
        ends_at: ends ? new Date(ends).toISOString() : null,
        created_by: user.id
      });

      msg.textContent = error ? error.message : "Pieza publicada";
      if (!error) {
        e.target.reset();
        loadListings();
      }
    });

    (async () => {
      const user = await requireAdmin();
      if (!user) return;
      msg.textContent = "Listo";
      loadUsers();
      loadListings();
      loadAvisos();
    })();
  </script>
</body>
</html>
