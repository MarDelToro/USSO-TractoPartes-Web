<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="/access-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro · USSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
 <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="usso-app.css?v=20261009-2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <form id="registro" class="auth-card">
    <img src="logo-usso-icon.png" alt="USSO">
    <h1>Crear cuenta</h1>
    <p class="auth-intro" id="authIntro">Regístrate para solicitar autorización y participar de forma segura.</p>
    <div class="auth-field"><label for="full_name">Nombre completo</label><input id="full_name" placeholder="Tu nombre" autocomplete="name" required></div>
    <div class="auth-field"><label for="phone">WhatsApp</label><input id="phone" inputmode="tel" placeholder="10 dígitos" autocomplete="tel" required></div>
    <div class="auth-field"><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
    <div class="auth-field"><label for="password">Contraseña</label><input id="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required></div>
    <button class="auth-submit" type="submit">Crear mi cuenta</button>
    <p class="msg" id="msg"></p>
    <div class="auth-links"><a class="primary-link" id="loginLink" href="login.html">Ya tengo una cuenta</a><a href="/#subastas">Ver subastas</a></div>
  </form>

  <script>
    const client = window.supabase.createClient(
      "https://ahhlfvjicxylidpmeciw.supabase.co",
      "sb_publishable_9Rr6Nv0ByITBW4TLhdC_HQ_WWpv4q5e"
    );
    const params = new URLSearchParams(window.location.search);
    const requestedNext = params.get("next") || "";
    const safeNext = requestedNext && !requestedNext.startsWith("//") && !requestedNext.includes("://") ? requestedNext : "";
    if (params.get("motivo") === "detalles") {
      document.getElementById("authIntro").textContent = "Crea tu cuenta gratis para desbloquear todas las fotografías, evidencia y detalles del producto.";
    }
    const loginParams = new URLSearchParams();
    if (safeNext) loginParams.set("next", safeNext);
    if (params.get("motivo")) loginParams.set("motivo", params.get("motivo"));
    const loginDestination = `login.html${[...loginParams].length ? `?${loginParams.toString()}` : ""}`;
    document.getElementById("loginLink").href = loginDestination;

    document.getElementById("registro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "Creando cuenta...";

      const { data, error } = await client.auth.signUp({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        options: {
          emailRedirectTo: new URL(loginDestination, window.location.href).href,
          data: {
            full_name: document.getElementById("full_name").value.trim(),
            phone: document.getElementById("phone").value.trim()
          }
        }
      });

      if (error) {
        msg.textContent = error.message;
        return;
      }

      if (!data.session) {
        msg.textContent = "Cuenta creada. Revisa tu correo y confirma tu cuenta antes de iniciar sesión.";
        return;
      }

      window.location.href = safeNext || "usso-tractopartes.dc.html";
    });
  </script>
</body>
</html>
