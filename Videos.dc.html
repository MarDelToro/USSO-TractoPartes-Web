<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a0b; font-family: 'Manrope', system-ui, sans-serif; }
  a { color: #f6c02a; text-decoration: none; }
  a:hover { color: #ffd75e; }
  ::selection { background: #f6c02a; color: #0a0a0b; }
  img, video { max-width: 100%; }
  @media (max-width: 860px) {
    .vid-nav-links, .vid-nav-cta, .vid-nav-search { display: none !important; }
    .vid-grid { grid-template-columns: 1fr !important; }
    .vid-pad { padding: 100px 20px 60px !important; }
  }
</style>
</helmet>

<div style="background:#0a0a0b;color:#f3f1ec;min-height:100vh;opacity:{{ pageOpacity }};transition:opacity 380ms ease">

  <nav style="position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:18px 48px;background:rgba(10,10,11,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.08)">
    <a href="USSO Tractopartes.dc.html#hero" onClick="{{ fadeBack }}" style="display:flex;align-items:center;cursor:pointer">
      <img src="assets/logo-usso-v2-transparent.png" alt="USSO Tractopartes" style="height:36px;width:auto;display:block">
    </a>
    <div style="display:flex;align-items:center;gap:20px">
      <div class="vid-nav-search" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:100px;padding:9px 16px;min-width:180px">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.2" stroke="rgba(243,241,236,0.55)" stroke-width="1.6"></circle><path d="M11.2 11.2L14.5 14.5" stroke="rgba(243,241,236,0.55)" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <input type="text" value="{{ searchValue }}" onChange="{{ onSearchChange }}" onKeyDown="{{ onSearchKeyDown }}" placeholder="Buscar pieza..." style="background:transparent;border:0;outline:0;color:#f3f1ec;font:600 13px Manrope,sans-serif;width:100%">
      </div>
      <a href="USSO Tractopartes.dc.html#videos" onClick="{{ fadeBack }}" class="vid-nav-cta" style="font:700 14px Manrope,sans-serif;color:#f3f1ec;border-bottom:2px solid {{ accent }};padding-bottom:3px;white-space:nowrap">← Volver al inicio</a>
    </div>
  </nav>

  <section class="vid-pad" style="padding:120px 48px 80px;max-width:1400px;margin:0 auto">
    <div style="margin-bottom:48px">
      <span style="font:700 12px Manrope,sans-serif;letter-spacing:0.2em;text-transform:uppercase;color:{{ accent }}">Contenido educativo</span>
      <h1 style="font-family:'Archivo Black',sans-serif;font-size:clamp(32px,4.4vw,52px);margin:10px 0 0;color:#f3f1ec">Todos nuestros videos</h1>
      <p style="font:500 16px/1.6 Manrope,sans-serif;color:rgba(243,241,236,0.6);max-width:560px;margin:16px 0 0">Subastas, revisiones de motor y recorridos — lo mismo que compartimos en TikTok y YouTube.</p>
    </div>
    <div class="vid-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px">
      <sc-for list="{{ videoItems }}" as="v" hint-placeholder-count="6">
        <div onClick="{{ v.play }}" style="background:#141416;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:{{ v.cursor }}">
          <sc-if value="{{ v.playing }}" hint-placeholder-val="{{ false }}">
            <div style="position:relative;width:100%;aspect-ratio:16/9;background:#000">
              <iframe src="{{ v.embedSrc }}" title="{{ v.title }}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen=""></iframe>
            </div>
          </sc-if>
          <sc-if value="{{ v.showThumb }}" hint-placeholder-val="{{ false }}">
            <div style="position:relative;width:100%;aspect-ratio:16/9;background:#000">
              <div ref="{{ v.setThumbEl }}" style="width:100%;height:100%;background-size:cover;background-position:center"></div>
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                <div style="width:56px;height:56px;border-radius:50%;background:rgba(10,10,11,0.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)">
                  <div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #f3f1ec;margin-left:4px"></div>
                </div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ v.showUpload }}" hint-placeholder-val="{{ true }}">
            <div style="position:relative;width:100%;aspect-ratio:16/9">
              <image-slot id="video-{{ v.id }}" shape="rect" placeholder="{{ v.placeholder }}" style="width:100%;height:100%"></image-slot>
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                <div style="width:56px;height:56px;border-radius:50%;background:rgba(10,10,11,0.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)">
                  <div style="width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #f3f1ec;margin-left:4px"></div>
                </div>
              </div>
            </div>
          </sc-if>
          <div style="padding:20px;display:flex;flex-direction:column;flex:1">
            <h3 style="font:800 17px Manrope,sans-serif;color:#f3f1ec;margin:0 0 8px;min-height:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ v.title }}</h3>
            <p style="font:500 14px/1.55 Manrope,sans-serif;color:rgba(243,241,236,0.6);margin:0">{{ v.desc }}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pageOpacity: 0, searchValue: '' };
  accent = '#f6c02a';

  componentDidMount() {
    requestAnimationFrame(() => this.setState({ pageOpacity: 1 }));
  }

  onSearchChange = (e) => this.setState({ searchValue: e.target.value });
  onSearchKeyDown = (e) => {
    if (e.key !== 'Enter') return;
    const q = this.state.searchValue.trim();
    window.location.href = q ? `Catalogo.dc.html?q=${encodeURIComponent(q)}` : 'Catalogo.dc.html';
  };

  fadeBack = (e) => {
    e.preventDefault();
    const href = e.currentTarget.getAttribute('href');
    this.setState({ pageOpacity: 0 });
    setTimeout(() => { window.location.href = href; }, 380);
  };

  rawVideoItems = [
    { id: 'v1', title: 'Desenmascarando la verdad. Así lucen los camiones "picados"', desc: 'El precio baja hasta que alguien dice "ya" — te explicamos las reglas.', placeholder: 'Video: Camiones picados', youtubeId: 'Y1shtNZuE7I' },
    { id: 'v2', title: 'Motor N14. Todo lo que necesitas saber antes de comprar.', desc: 'Puntos clave para inspeccionar un motor diesel reconstruido.', placeholder: 'Video: Revisión de motor', youtubeId: 'VpLLq30JocM' },
    { id: 'v3', title: 'Mancuernas y Diferenciales. Todo lo que necesitas saber', desc: 'Un vistazo real a una unidad antes de salir a subasta.', placeholder: 'Video: Recorrido de camión', youtubeId: 'qHK1ha7BPiw' },
  ];
  playingVideo = null;
  playVideo = (id) => () => { this.playingVideo = id; this.forceUpdate(); };

  renderVals() {
    return {
      accent: this.accent,
      pageOpacity: this.state.pageOpacity,
      fadeBack: this.fadeBack,
      searchValue: this.state.searchValue,
      onSearchChange: this.onSearchChange,
      onSearchKeyDown: this.onSearchKeyDown,
      videoItems: this.rawVideoItems.map((v) => {
        const playing = this.playingVideo === v.id;
        return {
          ...v,
          playing: playing && !!v.youtubeId,
          showThumb: !playing && !!v.youtubeId,
          showUpload: !v.youtubeId,
          embedSrc: v.youtubeId ? `https://www.youtube.com/embed/${v.youtubeId}?autoplay=1` : null,
          setThumbEl: v.youtubeId ? (el) => { if (el) el.style.backgroundImage = `url(https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg)`; } : null,
          cursor: v.youtubeId && !playing ? 'pointer' : 'default',
          play: v.youtubeId && !playing ? this.playVideo(v.id) : null,
        };
      }),
    };
  }
}

</script>
</body>
</html>
